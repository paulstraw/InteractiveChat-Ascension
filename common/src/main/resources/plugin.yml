name: InteractiveChat-Ascension
author: paulstraw
authors: [LOOHP]
version: ${project.version}
main: com.loohp.interactivechatdiscordsrvaddon.InteractiveChatDiscordSrvAddon
api-version: 1.13
folia-supported: false
description: Unofficial fork of LOOHP's InteractiveChat DiscordSRV Addon for DiscordSRV Ascension. Shows InteractiveChat items, inventories and ender chests in Discord.
website: https://github.com/paulstraw/InteractiveChat-Ascension
depend: [InteractiveChat, DiscordSRV-Ascension]
softdepend: [ItemsAdder, CraftEngine]
prefix: ICAscension

commands:
  interactivechatascension:
    usage: /<command>
    aliases: [ica]
    description: Plugin main command

permissions:
  interactivechatascension.reloadconfig:
    description: Allows you to reload the config
    default: op
  interactivechatascension.reloadtexture:
    description: Allows you to reload the texture
    default: op
  interactivechatascension.status:
    description: Allows you view the status of the plugin
    default: true
